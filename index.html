<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCMQ — ваш конституциональный профиль</title>
<style>
:root{
  --bg:#06251f;
  --bg2:#0b3328;
  --panel:rgba(4,31,26,.88);
  --panel2:rgba(7,43,34,.92);
  --gold:#f1c45c;
  --gold2:#ffd979;
  --gold-soft:rgba(241,196,92,.18);
  --text:#f8f8f1;
  --muted:#c6d0c8;
  --line:rgba(241,196,92,.26);
  --shadow:0 28px 70px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at 76% 18%, rgba(205,182,87,.14), transparent 24%),
    radial-gradient(circle at 18% 82%, rgba(114,140,77,.15), transparent 25%),
    linear-gradient(135deg,#031e1a 0%,#073127 47%,#09261f 100%);
  overflow-x:hidden;
}
body:before, body:after{
  content:"";
  position:fixed;
  inset:auto;
  pointer-events:none;
  z-index:0;
}
body:before{
  width:70vw;height:70vw;
  right:-34vw;top:-40vw;
  border:1px solid rgba(240,197,91,.16);
  border-radius:50%;
  box-shadow:
    0 0 0 24px rgba(240,197,91,.02),
    0 0 0 74px rgba(240,197,91,.018),
    0 0 0 128px rgba(240,197,91,.012);
}
body:after{
  left:-10vw;bottom:8vh;width:120vw;height:130px;
  border-top:2px solid rgba(244,202,104,.35);
  border-radius:50%;
  transform:rotate(-4deg);
  filter:drop-shadow(0 0 12px rgba(244,202,104,.28));
}
.wrap{
  position:relative;
  z-index:1;
  max-width:920px;
  margin:0 auto;
  padding:32px 18px 60px;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  margin:2px 0 26px;
}
.brand img{
  width:190px;
  max-width:52vw;
  height:auto;
  display:block;
  filter:drop-shadow(0 7px 16px rgba(0,0,0,.25));
}
.card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,rgba(7,45,35,.90),rgba(3,29,25,.94));
  border:1px solid rgba(242,197,91,.22);
  border-radius:28px;
  padding:42px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(8px);
}
.card:before{
  content:"";
  position:absolute;
  right:-80px;
  top:-120px;
  width:330px;
  height:330px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(245,206,105,.18) 0%,rgba(245,206,105,.04) 34%,transparent 66%);
}
.card:after{
  content:"";
  position:absolute;
  left:-5%;
  right:-5%;
  bottom:38px;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(247,203,96,.55),transparent);
  box-shadow:0 0 16px rgba(247,203,96,.38);
}
.kicker{
  font-size:14px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:800;
  margin-bottom:18px;
}
h1,h2{
  position:relative;
  z-index:1;
  margin:0;
  font-family:"Arial Narrow",Impact,Arial,sans-serif;
  text-transform:uppercase;
  letter-spacing:.015em;
  text-shadow:0 4px 0 rgba(0,0,0,.18);
}
h1{
  font-size:clamp(42px,8vw,82px);
  line-height:.94;
  max-width:760px;
}
h2{
  font-size:clamp(30px,5vw,52px);
  line-height:1.04;
  max-width:760px;
}
.subtitle{
  color:var(--gold);
  font-family:"Arial Narrow",Impact,Arial,sans-serif;
  text-transform:uppercase;
  font-size:clamp(26px,4vw,42px);
  line-height:1.05;
  margin:18px 0 6px;
}
p{
  position:relative;
  z-index:1;
  font-size:18px;
  line-height:1.58;
  color:var(--muted);
  max-width:720px;
}
p strong{color:#fff}
.btn{
  position:relative;
  z-index:1;
  display:block;
  width:100%;
  border:1px solid rgba(245,207,108,.42);
  border-radius:18px;
  padding:18px 20px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
  margin-top:16px;
  transition:.16s ease;
}
.btn:not(.answer){
  color:#11271e;
  background:linear-gradient(180deg,#ffd873,#e7b84b);
  box-shadow:0 8px 28px rgba(239,190,76,.22),inset 0 1px rgba(255,255,255,.55);
}
.btn:not(.answer):hover{transform:translateY(-1px);box-shadow:0 12px 32px rgba(239,190,76,.3)}
.answer{
  background:rgba(255,255,255,.035);
  color:#f8f8f1;
  border-color:rgba(241,196,92,.22);
  text-align:left;
  font-weight:700;
}
.answer:hover{
  transform:translateX(3px);
  border-color:rgba(255,215,120,.72);
  background:rgba(243,199,95,.09);
}
.progress{
  position:relative;
  z-index:1;
  height:7px;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(241,196,92,.12);
}
.progress b{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#d8a63a,#ffe28a);
  box-shadow:0 0 14px rgba(255,219,122,.75);
}
.meta{
  position:relative;
  z-index:1;
  display:flex;
  justify-content:space-between;
  gap:12px;
  color:#bfc8c1;
  font-size:14px;
  margin:12px 0 28px;
}
.row{position:relative;z-index:1;margin:19px 0}
.head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  font-weight:800;
  color:#fff;
  margin-bottom:8px
}
.bar{
  height:11px;
  background:rgba(255,255,255,.08);
  border-radius:999px;
  overflow:hidden;
  border:1px solid rgba(241,196,92,.1)
}
.bar i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#b98a2e,#f4ca63,#ffe7a0);
  box-shadow:0 0 12px rgba(248,208,104,.45)
}
.tag{
  position:relative;z-index:1;
  display:inline-block;
  background:rgba(241,196,92,.12);
  color:#ffe08b;
  border:1px solid rgba(241,196,92,.32);
  border-radius:999px;
  padding:8px 11px;
  margin:4px 5px 4px 0;
  font-size:13px;
  font-weight:800
}
.mid{text-align:center;padding:14px 0 8px}
.gold-line{
  height:1px;
  background:linear-gradient(90deg,transparent,#d8aa47,transparent);
  margin:26px 0 8px;
  box-shadow:0 0 12px rgba(234,185,77,.25)
}
@media(max-width:600px){
  .wrap{padding:18px 12px 40px}
  .brand{margin-bottom:14px}
  .brand img{width:150px}
  .card{padding:28px 20px;border-radius:22px}
  h1{font-size:48px}
  h2{font-size:34px}
  .subtitle{font-size:28px}
  p{font-size:16px}
  .btn{padding:16px 17px;font-size:17px}
}
@media print{
  body{background:white;color:black}
  .brand{display:none}
  .card{box-shadow:none;border:0;background:white;color:black}
  .card:before,.card:after{display:none}
  p,.meta{color:#333}
  h1,h2,.head{color:black;text-shadow:none}
}

/* --- FOHOW CCMQ UX refinements --- */
.brand{
  margin:4px 0 34px;
}
.brand img{
  width:240px;
  max-width:68vw;
  height:auto;
  object-fit:contain;
}

.card{
  padding:48px 54px 54px;
}

h2{
  margin-bottom:34px;
}

.btn{
  min-height:64px;
  border-radius:18px;
  padding:19px 24px;
  font-size:20px;
  line-height:1.15;
  margin-top:16px;
  letter-spacing:.01em;
}

.btn:not(.answer){
  min-height:72px;
  margin-top:30px;
  font-size:22px;
  text-transform:uppercase;
  letter-spacing:.025em;
}

.answer{
  margin-top:14px;
  border-width:1.5px;
  background:rgba(255,255,255,.045);
}

.answer:hover{
  transform:translateY(-1px);
}

#answers{
  margin-top:8px;
}

.question-wrap{
  margin-top:14px;
}

.meta{
  margin-bottom:34px;
}

.progress{
  margin-top:2px;
}

@media(max-width:600px){
  .brand{margin-bottom:22px}
  .brand img{width:190px}
  .card{padding:30px 22px 34px}
  h1{font-size:44px}
  h2{
    font-size:32px;
    line-height:1.08;
    margin-bottom:28px;
  }
  .btn{
    min-height:62px;
    font-size:18px;
    padding:18px 18px;
    margin-top:13px;
  }
  .btn:not(.answer){
    min-height:68px;
    font-size:20px;
    margin-top:28px;
  }
  .meta{
    margin-bottom:28px;
    font-size:13px;
  }
}


/* v3 explicit button layout */
#answers{
  display:flex !important;
  flex-direction:column !important;
  gap:16px !important;
  margin-top:34px !important;
  width:100% !important;
}
#answers .btn.answer{
  display:flex !important;
  align-items:center !important;
  width:100% !important;
  min-height:72px !important;
  margin:0 !important;
  padding:20px 24px !important;
  border-radius:18px !important;
  font-size:21px !important;
  line-height:1.2 !important;
  font-weight:800 !important;
  background:rgba(255,255,255,.055) !important;
  color:#fff !important;
  border:1.5px solid rgba(241,196,92,.30) !important;
  box-shadow:inset 0 1px rgba(255,255,255,.035);
}
#answers .btn.answer:hover{
  background:rgba(241,196,92,.12) !important;
  border-color:rgba(255,216,120,.78) !important;
}
.btn.primary{
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
  width:100% !important;
  min-height:78px !important;
  margin-top:34px !important;
  padding:21px 26px !important;
  border-radius:18px !important;
  font-size:22px !important;
  font-weight:900 !important;
  text-transform:uppercase !important;
  letter-spacing:.025em !important;
  color:#14251d !important;
  background:linear-gradient(180deg,#ffdc79,#e6b54a) !important;
  border:1px solid rgba(255,226,147,.75) !important;
  box-shadow:0 10px 30px rgba(231,181,74,.28), inset 0 1px rgba(255,255,255,.65) !important;
}
.question-wrap{
  margin-bottom:0 !important;
}
@media(max-width:600px){
  #answers{gap:13px !important;margin-top:28px !important}
  #answers .btn.answer{
    min-height:66px !important;
    font-size:18px !important;
    padding:18px 18px !important;
  }
  .btn.primary{
    min-height:70px !important;
    font-size:19px !important;
    margin-top:28px !important;
  }
}


/* --- authorship / attribution --- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:26px;
  margin-bottom:26px;
}
.topbar .brand{
  margin:0;
  flex:0 0 auto;
}
.author-block{
  margin-left:auto;
  text-align:right;
  max-width:360px;
  line-height:1.25;
}
.author-name{
  color:#f1c45c;
  font-size:19px;
  font-weight:900;
  letter-spacing:.02em;
}
.author-role{
  margin-top:5px;
  color:#d7ddd8;
  font-size:13px;
  line-height:1.35;
}
.author-link{
  margin-top:6px;
  color:#f1c45c;
  font-size:13px;
  font-weight:800;
  letter-spacing:.02em;
}
.site-footer{
  margin-top:18px;
  padding:0 8px;
  text-align:center;
  color:rgba(226,232,227,.66);
  font-size:12px;
  line-height:1.4;
}
@media(max-width:700px){
  .topbar{
    align-items:flex-start;
    gap:14px;
    margin-bottom:18px;
  }
  .topbar .brand img{
    width:155px;
    max-width:45vw;
  }
  .author-block{
    max-width:48vw;
  }
  .author-name{
    font-size:14px;
  }
  .author-role{
    font-size:10.5px;
  }
  .author-link{
    font-size:11px;
  }
}
@media(max-width:430px){
  .topbar{
    flex-direction:column;
    align-items:flex-start;
  }
  .author-block{
    max-width:100%;
    text-align:left;
  }
}


.author-link{
  text-decoration:none;
  display:inline-block;
}
.share-block{
  position:relative;
  z-index:1;
  margin-top:28px;
  padding-top:22px;
  border-top:1px solid rgba(241,196,92,.22);
}
.share-title{
  color:#f1c45c;
  font-size:15px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:12px;
}
.share-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:14px;
}
.share-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:58px;
  padding:14px 16px;
  border-radius:16px;
  border:1px solid rgba(241,196,92,.28);
  color:#f8f8f1;
  background:rgba(255,255,255,.045);
  text-decoration:none;
  font-size:15px;
  font-weight:800;
  text-align:center;
}
.share-btn:hover{
  background:rgba(241,196,92,.11);
  border-color:rgba(255,216,120,.68);
}
.copy-note{
  margin-top:10px;
  color:#bfc8c1;
  font-size:13px;
}
@media(max-width:560px){
  .share-grid{grid-template-columns:1fr}
  .share-btn{min-height:56px}
}


/* --- v7 author header refinement --- */
.topbar{
  align-items:center !important;
  gap:34px !important;
  margin-bottom:30px !important;
}
.topbar .brand img{
  width:225px !important;
  max-width:42vw !important;
}
.author-block{
  max-width:430px !important;
  text-align:right !important;
}
.author-name{
  color:#f1c45c !important;
  font-size:22px !important;
  font-weight:900 !important;
  line-height:1.1 !important;
  letter-spacing:.015em !important;
}
.author-role{
  margin-top:7px !important;
  color:#e4e9e5 !important;
  font-size:13.5px !important;
  line-height:1.35 !important;
  font-weight:600 !important;
}
.author-role span{
  display:block !important;
}
.author-link{
  margin-top:9px !important;
  display:inline-block !important;
  padding:7px 11px !important;
  border:1px solid rgba(241,196,92,.36) !important;
  border-radius:999px !important;
  color:#f1c45c !important;
  background:rgba(241,196,92,.06) !important;
  font-size:12.5px !important;
  font-weight:900 !important;
  text-decoration:none !important;
}
.author-link:hover{
  background:rgba(241,196,92,.12) !important;
}
@media(max-width:700px){
  .topbar{
    align-items:flex-start !important;
    gap:16px !important;
  }
  .topbar .brand img{
    width:170px !important;
    max-width:43vw !important;
  }
  .author-block{
    max-width:50vw !important;
  }
  .author-name{
    font-size:16px !important;
  }
  .author-role{
    font-size:10.8px !important;
    line-height:1.3 !important;
  }
  .author-link{
    font-size:10.8px !important;
    padding:6px 9px !important;
  }
}
@media(max-width:430px){
  .topbar{
    flex-direction:column !important;
    align-items:flex-start !important;
  }
  .author-block{
    max-width:100% !important;
    text-align:left !important;
  }
  .author-name{
    font-size:18px !important;
  }
  .author-role{
    font-size:12px !important;
  }
}

</style>

function intro(){app.innerHTML=`<div class="kicker">FOHOW • Практическая встреча</div><h1>Моя конституция</h1><div class="subtitle">Понять себя и увидеть свою картину</div><p>60 коротких вопросов о вашем обычном состоянии. Здесь нет правильных и неправильных ответов — выбирайте то, что ближе всего к вашим ощущениям за последний год.</p><p><strong>Около 7–10 минут.</strong> В конце вы получите свой профиль CCMQ. Сохраните его — на встрече мы будем работать именно с вашей картой.</p><button class="btn primary" onclick="q()">Начать анкету</button>`}
function q(){let p=Math.round(i/60*100);app.innerHTML=`<div class="progress"><b style="width:${p}%"></b></div><div class="meta"><span>Ваш профиль формируется</span><span>${p}%</span></div><div class="question-wrap"><h2>${Q[i]}</h2></div><div id="answers">${opts.map(x=>`<button class="btn answer" onclick="pick(${x[1]})">${x[0]}</button>`).join("")}</div>`}
function pick(v){a[i]=v;i++;if(i>=60)return result();if([10,20,30,40,50].includes(i))return mile();q()}
function mile(){let m={10:"Профиль уже начинает складываться.",20:"Хороший темп. Продолжайте отвечать интуитивно.",30:"Больше половины пути уже позади.",40:"Картина становится всё точнее.",50:"Осталось совсем немного."};let p=Math.round(i/60*100);app.innerHTML=`<div class="progress"><b style="width:${p}%"></b></div><div class="mid"><div class="kicker">Ваш профиль формируется • ${p}%</div><h2>${m[i]}</h2><p>Не анализируйте ответы слишком долго — выбирайте то, что чаще всего похоже на ваше обычное состояние.</p><button class="btn primary" onclick="q()">Продолжить</button></div>`}
function score(name,qs){let sum=0;qs.forEach(n=>{let v=a[n-1];if(name==="Сбалансированный тип"&&R.includes(n))v=6-v;sum+=v});let N=qs.length;return (sum-N)*100/(N*4)}
function result(){
  let rs=Object.entries(S).map(([n,qs])=>({n,s:score(n,qs)}));
  const balanced=rs.find(r=>r.n==="Сбалансированный тип");
  const unbalanced=rs.filter(r=>r.n!=="Сбалансированный тип");
  const expressed=unbalanced.filter(r=>r.s>=40).sort((a,b)=>b.s-a.s);
  const tendencies=unbalanced.filter(r=>r.s>=30&&r.s<40).sort((a,b)=>b.s-a.s);
  const isBalanced=balanced.s>=60 && unbalanced.every(r=>r.s<30);

  let headline=isBalanced ? "Сбалансированный профиль" : "Ваш профиль CCMQ";
  let leadItems=[];
  if(isBalanced){
    leadItems=[balanced];
  }else{
    leadItems=[...expressed,...tendencies].slice(0,3);
    if(leadItems.length===0){
      leadItems=unbalanced.slice().sort((a,b)=>b.s-a.s).filter(r=>r.s>0).slice(0,3);
    }
  }

  const chips = leadItems.length
    ? leadItems.map(r=>`<span class="tag">${r.n} · ${Math.round(r.s)}</span>`).join("")
    : `<span class="tag">Выраженных тенденций не выявлено</span>`;

  const ordered=[balanced,...unbalanced.sort((a,b)=>b.s-a.s)];

  const resultText = ordered.map(r=>`${r.n}: ${Math.round(r.s)}`).join("\n");
  const fullShareText = `Мой результат CCMQ
${resultText}

Катерина Кирилюк — специальный представитель Международного бизнес-колледжа FOHOW
Telegram: @KataKiril
WhatsApp: +7 911 007-15-36
Instagram: @katerina_fohow`;
  window.__ccmqShareText = fullShareText;

  const waText = encodeURIComponent(`Здравствуйте, Катерина! Я прошёл(а) анкету CCMQ.

${resultText}`);
  const waUrl = `https://wa.me/79110071536?text=${waText}`;

  app.innerHTML=`
    <div class="kicker">Ваш результат готов</div>
    <h1>Моя конституция</h1>
    <div class="subtitle">${headline}</div>
    <p>${isBalanced
      ? "По результатам анкеты сбалансированный тип выражен, а другие конституциональные тенденции не достигают пороговых значений."
      : "Это не один «тип», а сочетание нескольких тенденций. Ниже — ваша индивидуальная карта."}</p>
    <div>${chips}</div>
    <div class="gold-line"></div>
    ${ordered.map(r=>`
      <div class="row">
        <div class="head"><span>${r.n}</span><span>${Math.round(r.s)}</span></div>
        <div class="bar"><i style="width:${Math.max(0,Math.min(100,r.s))}%"></i></div>
      </div>`).join("")}

    <p><strong>Сохраните или отправьте этот результат.</strong> На встрече мы разберём, что означают ваши ведущие показатели и как они складываются в индивидуальную картину.</p>

    <button class="btn primary" onclick="shareResult()">Отправить / сохранить результат</button>

    <div class="share-block">
      <div class="share-title">Связаться с Катериной</div>
      <div class="share-grid">
        <a class="share-btn" href="${waUrl}" target="_blank" rel="noopener">WhatsApp Катерины</a>
        <a class="share-btn" href="https://t.me/KataKiril" target="_blank" rel="noopener">Telegram @KataKiril</a>
        <a class="share-btn" href="https://www.instagram.com/katerina_fohow/" target="_blank" rel="noopener">Instagram @katerina_fohow</a>
        <button class="share-btn" onclick="copyResult()">Скопировать результат</button>
      </div>
      <div class="copy-note">Кнопка «Отправить / сохранить результат» открывает системное меню телефона — через него можно выбрать Telegram, WhatsApp, MAX, почту или другое приложение.</div>
    </div>

    <button class="btn answer" onclick="location.reload()">Пройти заново</button>
  `;
}

async function shareResult(){
  const text = window.__ccmqShareText || "Мой результат CCMQ";
  const data = {
    title: "Мой результат CCMQ",
    text,
    url: window.location.href
  };
  if(navigator.share){
    try{
      await navigator.share(data);
      return;
    }catch(e){
      if(e && e.name==="AbortError") return;
    }
  }
  try{
    await navigator.clipboard.writeText(text + "\n" + window.location.href);
    alert("Результат скопирован. Теперь его можно вставить в Telegram, WhatsApp, MAX, почту или другое приложение.");
  }catch(e){
    alert("Не удалось открыть меню отправки. Используйте кнопку «Скопировать результат» ниже.");
  }
}

async function copyResult(){
  const text = (window.__ccmqShareText || "Мой результат CCMQ") + "\n" + window.location.href;
  try{
    await navigator.clipboard.writeText(text);
    alert("Результат скопирован.");
  }catch(e){
    alert("Не удалось скопировать автоматически.");
  }
}
intro();
</script>
